name: aqarat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  file_picker: ^13.1.0
  path_provider: ^2.1.2
  share_plus: ^13.3.1
  flutter_contacts: 1.1.9+2
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"